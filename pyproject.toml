[project]
name = "vehicle-days"
version = "0.3.0"
description = "Private traffic agents, binding negotiation and an inspectable day"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vehicle-days = "vehicle_days.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_days"]

[tool.pytest.ini_options]
testpaths = ["tests"]
